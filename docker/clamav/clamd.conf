# clamd, as this platform needs it.
#
# Scanning is by path over a shared read-only volume rather than INSTREAM, so
# the socket carries a filename and clamd reads the file itself. That avoids
# StreamMaxLength entirely, which would otherwise cap uploads at 25 MB.

Foreground true
LogTime true
LogClean false

# Reached only over the compose network; the port is never published.
TCPSocket 3310
TCPAddr 0.0.0.0

User clamav
DatabaseDirectory /var/lib/clamav

# Lecture recordings are large. Below these limits clamd scans the whole file;
# above them it skips silently and reports OK, so they are set near clamd's
# ceiling rather than at a comfortable default.
MaxFileSize 4000M
MaxScanSize 4000M

# Archive bombs: bounded depth and count rather than unbounded recursion.
MaxRecursion 12
MaxFiles 10000
MaxScanTime 300000

# One thread per available OCPU, with headroom for the reload.
MaxThreads 4
MaxQueue 50

# Refuse to follow anything out of the storage volume.
FollowDirectorySymlinks false
FollowFileSymlinks false

# Heuristics worth having for a site that redistributes user uploads.
DetectPUA false
HeuristicAlerts true
AlertOLE2Macros true
