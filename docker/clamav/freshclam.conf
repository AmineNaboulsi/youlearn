# Signature updates.
#
# Runs alongside clamd in the same container. Definitions live on a volume, so
# a restart does not re-download 250 MB.

DatabaseDirectory /var/lib/clamav
DatabaseOwner clamav
UpdateLogFile /dev/stdout
LogTime true

DatabaseMirror database.clamav.net

# Twice a day. ClamAV asks that clients not poll more often than hourly, and
# nothing here justifies being aggressive about it.
Checks 2

# Fail visibly rather than retrying forever behind a broken network.
ConnectTimeout 60
ReceiveTimeout 300
