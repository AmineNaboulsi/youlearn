# Signature updates.
#
# Runs alongside clamd in the same container. Definitions live on a volume, so
# a restart does not re-download 250 MB.

DatabaseDirectory /var/lib/clamav
DatabaseOwner clamav
# No UpdateLogFile on purpose. Pointing it at /dev/stdout fails with "Too many
# levels of symbolic links" — /dev/stdout is a symlink into /proc/self/fd, which
# freshclam's logger will not follow — and the failure is fatal: libfreshclam
# refuses to initialise, no database is ever downloaded, and the container exits
# before clamd starts. The --stdout flag the entrypoint passes does the same job.
LogTime true

DatabaseMirror database.clamav.net

# Twice a day. ClamAV asks that clients not poll more often than hourly, and
# nothing here justifies being aggressive about it.
Checks 2

# Fail visibly rather than retrying forever behind a broken network.
ConnectTimeout 60
ReceiveTimeout 300
