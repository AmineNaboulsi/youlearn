# YouLearn login theme.
#
# Built on `base` rather than `keycloak` so no PatternFly stylesheet ships with
# the page. Every class name below is ours, so login.css has total control and
# the result matches the Next.js app exactly.

parent=base
import=common/keycloak

styles=css/login.css
stylesCommon=

# The platform is light-only and monochrome by design decision, so the theme
# does not expose a dark variant and never reads prefers-color-scheme.
darkMode=false

kcHtmlClass=yl-html
kcBodyClass=yl-body

kcLoginClass=yl-login
kcHeaderClass=yl-header
kcHeaderWrapperClass=yl-header__wrapper

kcContentWrapperClass=yl-content
kcFormCardClass=yl-card
kcFormCardAccountClass=yl-card
kcFormHeaderClass=yl-card__header
kcFormSocialAccountSectionClass=yl-social

kcLocaleWrapperClass=yl-locale
kcLocaleMainClass=yl-locale__main
kcLocaleDropDownClass=yl-locale__dropdown
kcLocaleListClass=yl-locale__list
kcLocaleItemClass=yl-locale__item

kcFormClass=yl-form
kcFormGroupClass=yl-field
kcFormGroupErrorClass=yl-field--error
kcFormOptionsClass=yl-form__options
kcFormButtonsClass=yl-form__buttons
kcFormSettingClass=yl-form__setting

kcLabelWrapperClass=yl-label-wrap
kcLabelClass=yl-label
kcInputWrapperClass=yl-input-wrap
kcInputClass=yl-input
kcInputHelperTextAfterClass=yl-help
kcInputErrorMessageClass=yl-error
kcInputGroup=yl-input-group

kcCheckboxInputClass=yl-checkbox
kcCheckboxLabelClass=yl-checkbox-label

kcButtonClass=yl-btn
kcButtonPrimaryClass=yl-btn--primary
kcButtonDefaultClass=yl-btn--default
kcButtonSecondaryClass=yl-btn--secondary
kcButtonLargeClass=yl-btn--lg
kcButtonBlockClass=yl-btn--block

kcFormPasswordVisibilityButtonClass=yl-eye
kcFormPasswordVisibilityIconShow=yl-eye__show
kcFormPasswordVisibilityIconHide=yl-eye__hide

kcAlertClass=yl-alert
kcAlertTitleClass=yl-alert__title
kcFeedbackAreaClass=yl-feedback
kcFeedbackErrorIcon=yl-alert--error
kcFeedbackWarningIcon=yl-alert--warning
kcFeedbackSuccessIcon=yl-alert--success
kcFeedbackInfoIcon=yl-alert--info

kcFormSocialAccountListClass=yl-social__list
kcFormSocialAccountListGridClass=yl-social__list--grid
kcFormSocialAccountClass=yl-social__item
kcFormSocialAccountNameClass=yl-social__name
kcFormSocialAccountLinkClass=yl-social__link
kcFormSocialAccountListButtonClass=yl-btn yl-btn--default yl-btn--block

kcInfoAreaWrapperClass=yl-info
kcSignUpClass=yl-signup
kcResetFlowInfoClass=yl-reset-info
kcSelectAuthListClass=yl-authlist
kcSelectAuthListItemClass=yl-authlist__item
kcSelectAuthListItemArrowClass=yl-authlist__arrow
kcSelectAuthListItemHeadingClass=yl-authlist__heading
kcSelectAuthListItemDescriptionClass=yl-authlist__desc
kcSelectAuthListItemBodyClass=yl-authlist__body
kcSelectAuthListItemFillClass=yl-authlist__fill
kcSelectAuthListItemIconClass=yl-authlist__icon

kcAuthenticatorDefaultClass=yl-auth-icon
kcAuthenticatorPasswordClass=yl-auth-icon
kcAuthenticatorOTPClass=yl-auth-icon
kcAuthenticatorWebAuthnClass=yl-auth-icon
kcAuthenticatorWebAuthnPasswordlessClass=yl-auth-icon

kcRecoveryCodesActionsClass=yl-form__buttons
kcRecoveryCodesList=yl-recovery-list
kcRecoveryCodesWarning=yl-alert yl-alert--warning

kcTermsClass=yl-terms
kcSrOnlyClass=yl-sr-only
