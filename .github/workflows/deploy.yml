# Build the three images and publish them. The instance deploys itself.
#
# Runs on every push to main — which, with pull requests as the way changes
# arrive, means on every merged PR. CI has already run on the branch; this
# rebuilds because the artefact published must come from the merge commit, not
# from the branch as it looked before merging.
#
# ## Why this workflow never connects to the server
#
# Port 22 is open only to the operator's own address. Letting a GitHub runner
# through would mean either opening sshd to the internet or putting a VPN in the
# deploy path, and both are worse than the alternative: the instance polls. A
# systemd timer there runs deploy/update.sh every two minutes, which pulls this
# repository for configuration and OCIR for images, then reconciles.
#
# So this workflow publishes, then watches. It holds no SSH key, no host
# address, and nothing that grants access to the machine — the worst a stolen
# token here can do is push an image, not run a command.
#
# `verify` is what closes the loop: /api/health reports the SHA its image was
# built from, and the job polls until that matches what it just built. Without
# it, green would only mean the images uploaded.
#
# Every image is tagged twice: `latest`, which the compose file references, and
# the commit SHA. Rolling back is retagging a known-good SHA to latest — the
# instance picks it up on its next tick, with no pipeline run at all.
#
# ## Required repository secrets
#
#   OCI_USERNAME      <namespace>/<identity-provider>/<email>
#   OCI_AUTH_TOKEN    an OCI auth token — NOT your console password
#   OCI_NAMESPACE     the tenancy's object-storage namespace
#
# ## Required repository variables
#
#   OCI_REGISTRY      e.g. ocir.af-casablanca-1.oci.oraclecloud.com
#   APP_URL           e.g. https://learn.naboulsiamine.com

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_verify:
        description: "Publish the images but do not wait for the rollout"
        type: boolean
        default: false

# Never let two publishes interleave. Not cancel-in-progress: whichever finished
# last would otherwise decide what `latest` points at.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  push:
    name: build and push
    runs-on: ubuntu-24.04-arm
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # Fail here, naming what is missing, rather than several steps later with
      # a message about the thing that was configured from it. An unset `vars.X`
      # interpolates to an empty string, so every consumer downstream receives a
      # plausible-looking empty argument instead of an error.
      - name: Check required configuration
        env:
          OCI_REGISTRY: ${{ vars.OCI_REGISTRY }}
          APP_URL: ${{ vars.APP_URL }}
          OCI_USERNAME: ${{ secrets.OCI_USERNAME }}
          OCI_AUTH_TOKEN: ${{ secrets.OCI_AUTH_TOKEN }}
          OCI_NAMESPACE: ${{ secrets.OCI_NAMESPACE }}
        run: |
          missing=()
          for name in OCI_REGISTRY APP_URL OCI_USERNAME OCI_AUTH_TOKEN OCI_NAMESPACE; do
            [ -n "${!name}" ] || missing+=("$name")
          done

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Not configured: ${missing[*]}"
            echo "Set these under Settings -> Secrets and variables -> Actions:"
            echo "  Variables: OCI_REGISTRY, APP_URL"
            echo "  Secrets:   OCI_USERNAME, OCI_AUTH_TOKEN, OCI_NAMESPACE"
            echo "The table in infra/README.md says what each one holds."
            exit 1
          fi

          # This becomes the redirect-URI allowlist on the Keycloak client. A
          # plain-http origin there would be a downgrade for every login.
          case "$APP_URL" in
            https://*) ;;
            *) echo "::error::APP_URL must be an https:// URL, got '$APP_URL'"; exit 1 ;;
          esac

      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The realm that ships in the image is generated, not committed: the
      # committed one carries development accounts and placeholder client
      # secrets. This strips both and pins the origin, and it exits non-zero if
      # any development credential survives.
      - name: Generate the deployable realm
        run: |
          node scripts/make-prod-realm.mjs \
            --in  keycloak/realm/youlearn-realm.json \
            --out keycloak/realm-prod/youlearn-realm.json \
            --web-origin "${{ vars.APP_URL }}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.OCI_REGISTRY }}
          username: ${{ secrets.OCI_USERNAME }}
          password: ${{ secrets.OCI_AUTH_TOKEN }}

      - name: Push keycloak
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/keycloak/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ vars.OCI_REGISTRY }}/${{ secrets.OCI_NAMESPACE }}/youlearnkeycloak:latest
            ${{ vars.OCI_REGISTRY }}/${{ secrets.OCI_NAMESPACE }}/youlearnkeycloak:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=keycloak
          cache-to: type=gha,mode=max,scope=keycloak

      - name: Push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          target: prod
          platforms: linux/arm64
          push: true
          tags: |
            ${{ vars.OCI_REGISTRY }}/${{ secrets.OCI_NAMESPACE }}/youlearnapi:latest
            ${{ vars.OCI_REGISTRY }}/${{ secrets.OCI_NAMESPACE }}/youlearnapi:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Push web
        uses: docker/build-push-action@v6
        with:
          context: web
          file: docker/web/Dockerfile
          platforms: linux/arm64
          push: true
          # What /api/health reports, and therefore what `verify` waits for.
          build-args: |
            BUILD_SHA=${{ steps.meta.outputs.tag }}
          tags: |
            ${{ vars.OCI_REGISTRY }}/${{ secrets.OCI_NAMESPACE }}/youlearnweb:latest
            ${{ vars.OCI_REGISTRY }}/${{ secrets.OCI_NAMESPACE }}/youlearnweb:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  verify:
    name: wait for the rollout
    needs: push
    if: ${{ !inputs.skip_verify }}
    runs-on: ubuntu-latest
    steps:
      # The instance checks every two minutes and then pulls three images, so
      # the first several polls are expected to report the old SHA. Fifteen
      # minutes is slack, not an estimate.
      - name: Poll /api/health for the new build
        env:
          APP_URL: ${{ vars.APP_URL }}
          WANT: ${{ needs.push.outputs.tag }}
        run: |
          echo "waiting for $WANT at $APP_URL/api/health"
          got=""

          for attempt in $(seq 1 45); do
            body=$(curl -fsS --max-time 20 "$APP_URL/api/health" 2>/dev/null || true)
            got=$(printf '%s' "$body" | sed -n 's/.*"sha":"\([^"]*\)".*/\1/p')

            if [ "$got" = "$WANT" ]; then
              echo "live after roughly $((attempt * 20))s"
              exit 0
            fi

            printf '  %2d/45  serving %s\n' "$attempt" "${got:-<no response>}"
            sleep 20
          done

          echo "::error::$WANT did not go live within 15 minutes (still serving '${got:-nothing}')"
          echo "The images published fine — it is the rollout that stalled."
          echo "On the instance:  journalctl -u youlearn-update -n 50"
          exit 1
