# Build the three images, push them to OCIR, and roll the running stack.
#
# Runs on every push to main — which, with pull requests as the way changes
# arrive, means "on every merged PR". CI has already run on the branch; this
# workflow re-runs the build because the artefact it publishes must come from
# the merge commit, not from the branch as it looked before merging.
#
# Every image is tagged twice: `latest`, which the compose file references, and
# the commit SHA, which is what makes a rollback possible. Retagging a SHA to
# latest and re-running the deploy job is the whole procedure.
#
# ## Required repository secrets
#
#   OCI_USERNAME      <namespace>/<identity-provider>/<email>, e.g.
#                     axogvxgfpmnk/Default/you@example.com
#   OCI_AUTH_TOKEN    an OCI auth token — NOT your console password
#   OCI_NAMESPACE     the tenancy's object-storage namespace
#   SSH_HOST          the instance's public IP
#   SSH_PRIVATE_KEY   a private key whose public half is on the instance
#   SSH_KNOWN_HOSTS   output of: ssh-keyscan -H <ip>
#
# ## Required repository variables
#
#   OCI_REGISTRY      e.g. ocir.af-casablanca-1.oci.oraclecloud.com
#   APP_URL           e.g. https://learn.naboulsiamine.com
#
# SSH_KNOWN_HOSTS is not optional theatre. Without it the only alternatives are
# disabling host key checking or trusting the first key offered, both of which
# hand anyone who can answer on that address a root-capable session.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: "Build and push images, but do not touch the server"
        type: boolean
        default: false

# Never let two deploys interleave on one host. Not cancel-in-progress: a
# half-finished deploy is worse than a queued one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  push:
    name: build and push
    runs-on: ubuntu-24.04-arm
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # Fail here, naming what is missing, rather than several steps later with
      # a message about the thing that was configured from it. An unset `vars.X`
      # interpolates to an empty string, so every consumer downstream receives a
      # plausible-looking empty argument instead of an error.
      - name: Check required configuration
        env:
          OCI_REGISTRY: ${{ vars.OCI_REGISTRY }}
          APP_URL: ${{ vars.APP_URL }}
          OCI_USERNAME: ${{ secrets.OCI_USERNAME }}
          OCI_AUTH_TOKEN: ${{ secrets.OCI_AUTH_TOKEN }}
          OCI_NAMESPACE: ${{ secrets.OCI_NAMESPACE }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          missing=()
          required="OCI_REGISTRY APP_URL OCI_USERNAME OCI_AUTH_TOKEN OCI_NAMESPACE"
          required="$required SSH_HOST SSH_PRIVATE_KEY SSH_KNOWN_HOSTS"
          for name in $required; do
            [ -n "${!name}" ] || missing+=("$name")
          done

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Not configured: ${missing[*]}"
            echo "Set these under Settings -> Secrets and variables -> Actions:"
            echo "  Variables: OCI_REGISTRY, APP_URL"
            echo "  Secrets:   OCI_USERNAME, OCI_AUTH_TOKEN, OCI_NAMESPACE,"
            echo "             SSH_HOST, SSH_PRIVATE_KEY, SSH_KNOWN_HOSTS"
            echo "The table in infra/README.md says what each one holds."
            exit 1
          fi

          # This becomes the redirect-URI allowlist on the Keycloak client. A
          # plain-http origin there would be a downgrade for every login.
          case "$APP_URL" in
            https://*) ;;
            *) echo "::error::APP_URL must be an https:// URL, got '$APP_URL'"; exit 1 ;;
          esac

      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The realm that ships in the image is generated, not committed: the
      # committed one carries development accounts and placeholder client
      # secrets. This strips both and pins the origin, and it exits non-zero if
      # any development credential survives.
      - name: Generate the deployable realm
        run: |
          node scripts/make-prod-realm.mjs \
            --in  keycloak/realm/youlearn-realm.json \
            --out keycloak/realm-prod/youlearn-realm.json \
            --web-origin "${{ vars.APP_URL }}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.OCI_REGISTRY }}
          username: ${{ secrets.OCI_USERNAME }}
          password: ${{ secrets.OCI_AUTH_TOKEN }}

      - name: Push keycloak
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/keycloak/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ vars.OCI_REGISTRY }}/${{ secrets.OCI_NAMESPACE }}/youlearnkeycloak:latest
            ${{ vars.OCI_REGISTRY }}/${{ secrets.OCI_NAMESPACE }}/youlearnkeycloak:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=keycloak
          cache-to: type=gha,mode=max,scope=keycloak

      - name: Push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          target: prod
          platforms: linux/arm64
          push: true
          tags: |
            ${{ vars.OCI_REGISTRY }}/${{ secrets.OCI_NAMESPACE }}/youlearnapi:latest
            ${{ vars.OCI_REGISTRY }}/${{ secrets.OCI_NAMESPACE }}/youlearnapi:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Push web
        uses: docker/build-push-action@v6
        with:
          context: web
          file: docker/web/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ vars.OCI_REGISTRY }}/${{ secrets.OCI_NAMESPACE }}/youlearnweb:latest
            ${{ vars.OCI_REGISTRY }}/${{ secrets.OCI_NAMESPACE }}/youlearnweb:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: roll the stack
    needs: push
    if: ${{ !inputs.skip_deploy }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # Configuration travels with the code. The .env on the server is NOT
      # touched: it holds generated secrets that exist only there, and
      # overwriting it from CI would mean CI had to hold them too.
      - name: Sync configuration
        run: |
          scp -i ~/.ssh/id_deploy docker-compose.prod.yml \
            ubuntu@${{ secrets.SSH_HOST }}:/opt/youlearn/
          scp -i ~/.ssh/id_deploy deploy/Caddyfile \
            ubuntu@${{ secrets.SSH_HOST }}:/opt/youlearn/deploy/
          ssh -i ~/.ssh/id_deploy ubuntu@${{ secrets.SSH_HOST }} \
            'mkdir -p /opt/youlearn/backend'
          scp -i ~/.ssh/id_deploy -r backend/Database \
            ubuntu@${{ secrets.SSH_HOST }}:/opt/youlearn/backend/

      - name: Pull and restart
        run: |
          ssh -i ~/.ssh/id_deploy ubuntu@${{ secrets.SSH_HOST }} bash -euo pipefail <<'REMOTE'
            cd /opt/youlearn
            echo "${{ secrets.OCI_AUTH_TOKEN }}" \
              | docker login "${{ vars.OCI_REGISTRY }}" \
                  -u "${{ secrets.OCI_USERNAME }}" --password-stdin

            docker compose -f docker-compose.prod.yml pull keycloak api web
            # --no-deps on nothing: compose restarts only what changed, and the
            # databases and clamav keep running untouched.
            docker compose -f docker-compose.prod.yml up -d

            docker logout "${{ vars.OCI_REGISTRY }}" || true
            # Images accumulate a layer set per deploy; without this the 50 GB
            # boot volume fills in a couple of months.
            docker image prune -f --filter 'until=168h'
          REMOTE

      # A deploy that leaves a container unhealthy should fail loudly rather
      # than report success because `up -d` returned zero.
      - name: Verify
        run: |
          ssh -i ~/.ssh/id_deploy ubuntu@${{ secrets.SSH_HOST }} bash -euo pipefail <<'REMOTE'
            cd /opt/youlearn
            for attempt in $(seq 1 30); do
              unhealthy=$(docker compose -f docker-compose.prod.yml ps \
                --format '{{.Name}} {{.State}} {{.Health}}' \
                | awk '$2 != "running" || ($3 != "" && $3 != "healthy")' || true)
              [ -z "$unhealthy" ] && { echo "all services healthy"; exit 0; }
              echo "waiting ($attempt/30):"; echo "$unhealthy"
              sleep 10
            done
            echo "services did not become healthy:"; echo "$unhealthy"
            docker compose -f docker-compose.prod.yml ps
            exit 1
          REMOTE

      - name: Public smoke test
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "${{ vars.APP_URL }}/")
          echo "GET ${{ vars.APP_URL }}/ -> $code"
          # 2xx or a redirect to Keycloak both mean the app is serving.
          case "$code" in 2??|3??) exit 0 ;; *) exit 1 ;; esac
