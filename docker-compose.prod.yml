# =============================================================================
# YouLearn — running the pushed images on a server.
#
# Unlike docker-compose.yml (which builds from source and bind-mounts the
# working tree), this pulls the two images from OCIR and mounts nothing but
# data volumes.
#
#   docker login ocir.<region>.oci.oraclecloud.com
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Everything secret comes from a .env file next to this one. Nothing in this
# file, and nothing in either image, contains a credential.
#
# TLS terminates at the bundled Caddy service. It is the only service that
# publishes a port to the world; Keycloak and the API speak plain HTTP on the
# internal network and are unreachable from outside the host. The log UI
# publishes one too, but to 127.0.0.1, which is reachable only through an SSH
# tunnel — see the logging block at the bottom.
# =============================================================================

# Local log rotation, applied to every service below.
#
# Without it the json-file driver keeps every line a container has ever written
# until the boot volume is full. Three files of 10 MB is enough to read a crash
# that just happened; anything older is the `logs` service's job — see the
# logging block at the bottom of this file.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # TLS termination. Caddy obtains and renews Let's Encrypt certificates on its
  # own, provided both hostnames resolve here and 80/443 are open in BOTH the
  # OCI security list and the instance's iptables.
  proxy:
    # Overridable so the public images can be mirrored into OCIR when Docker Hub
    # is unreachable or rate-limiting. Default is the upstream image.
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # Caddy's admin API, on the host's loopback and nowhere else. Reaching it
      # means an SSH tunnel — the same way in as the log UI — so it needs no
      # security-list rule and is not open to any network. Widening this to
      # 0.0.0.0 would publish an unauthenticated endpoint that can repoint both
      # hostnames; the `origins` list in deploy/Caddyfile would also have to
      # change, which is the friction that keeps it from happening by accident.
      - "127.0.0.1:2019:2019"
    environment:
      WEB_ORIGIN: ${WEB_ORIGIN:?set WEB_ORIGIN}
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:?set KEYCLOAK_PUBLIC_URL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - keycloak
      - api
      - web
    logging: *logging
    networks: [youlearn]

  keycloak-db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 20
    logging: *logging
    networks: [youlearn]

  keycloak:
    image: ${OCI_REGISTRY:?set OCI_REGISTRY}/${OCI_NAMESPACE:?set OCI_NAMESPACE}/${KEYCLOAK_REPO:-youlearnkeycloak}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["start", "--optimized", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}

      # The public URL users reach Keycloak on. Wrong here means redirect URIs
      # and token issuers disagree, and every login fails.
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:?set KEYCLOAK_PUBLIC_URL}

      # TLS terminates upstream, so Keycloak must read the real scheme and
      # client address from the proxy rather than from the socket.
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"

      # First boot only. Once a real administrator exists, remove these two
      # lines and redeploy — leaving them is leaving a known account behind.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 60s
    logging: *logging
    networks: [youlearn]

  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: youlearn
      MYSQL_USER: youlearn
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      # Runs once, on an empty data directory. Later schema changes go through
      # backend/Database/migrations/ by hand.
      - ./backend/Database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uyoulearn", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 30
    logging: *logging
    networks: [youlearn]

  # Malware scanning for uploads.
  #
  # Shares the storage volume READ-ONLY and scans by path rather than over the
  # socket: clamd's StreamMaxLength caps INSTREAM at 25 MB by default, and a
  # lecture recording here can be four gigabytes. The mount point must match the
  # API's exactly — the API sends clamd an absolute path, and clamd resolves it
  # in its own filesystem.
  #
  # The image runs freshclam alongside clamd, so signatures update themselves.
  # First boot downloads roughly 250 MB of definitions before it reports healthy.
  clamav:
    # Built here, not pulled: the official clamav/clamav image publishes
    # linux/amd64 only, every tag, so it cannot run on this arm64 host.
    image: ${CLAMAV_IMAGE:-${OCI_REGISTRY}/${OCI_NAMESPACE}/${CLAMAV_REPO:-youlearnclamav}:${IMAGE_TAG:-latest}}
    restart: unless-stopped
    environment:
      CLAMAV_NO_MILTERD: "true"
      FRESHCLAM_CHECKS: "2"
    volumes:
      - storage-data:/var/www/storage:ro
      - clamav-db:/var/lib/clamav
    # No healthcheck here on purpose — the image defines its own, and a
    # healthcheck in compose silently overrides it.
    #
    # This block used to run `clamdcheck.sh`, which ships with the official
    # clamav/clamav image and does not exist in the Debian-based one that
    # replaced it. Every probe exited 127, the container never became healthy,
    # and api and web — which wait on it — never started, so the site served
    # 502 while clamd itself was running perfectly and answering PING.
    #
    # The image knows which tools it has. Leaving the check there keeps the
    # two from drifting apart again.
    logging: *logging
    networks: [youlearn]

  api:
    image: ${OCI_REGISTRY}/${OCI_NAMESPACE}/${API_REPO:-youlearnapi}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      APP_ENV: production

      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: youlearn
      DB_USER: youlearn
      DB_PASS: ${MYSQL_PASSWORD}

      # Internal: how this container reaches Keycloak. Public: what appears in
      # the `iss` claim of tokens minted through the browser. Both are accepted
      # by the verifier; neither may be guessed.
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL}
      KEYCLOAK_REALM: youlearn
      KEYCLOAK_AUDIENCE: youlearn-api

      # Generated by Keycloak on first import — read it with
      # scripts/read-client-secrets.sh and put it here.
      KEYCLOAK_ADMIN_CLIENT_ID: youlearn-admin
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?set KEYCLOAK_ADMIN_CLIENT_SECRET}

      # Exact origins only. A wildcard would let any site read per-user data.
      ALLOWED_ORIGINS: ${WEB_ORIGIN:?set WEB_ORIGIN}

      RATE_LIMIT_PEPPER: ${RATE_LIMIT_PEPPER:?set RATE_LIMIT_PEPPER}

      # The reverse proxy in front of this stack. Without it, X-Forwarded-For is
      # ignored and every rate-limit bucket and audit row records the proxy's
      # address instead of the caller's.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}

      STORAGE_ROOT: /var/www/storage

      # Every upload is scanned before it is moved into permanent storage.
      # Setting CLAMAV_ENABLED=false disables that; there is no good reason to
      # on a site that redistributes user-supplied files.
      CLAMAV_ENABLED: ${CLAMAV_ENABLED:-true}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      CLAMAV_TIMEOUT: ${CLAMAV_TIMEOUT:-600}
    volumes:
      # Uploaded covers and lesson videos. Losing this volume loses every video
      # on the platform — back it up like a database.
      - storage-data:/var/www/storage
    depends_on:
      mysql:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      clamav:
        condition: service_healthy
    logging: *logging
    networks: [youlearn]

  # The Next.js front end. This is the only thing users' browsers talk to
  # besides Keycloak: the PHP API has no public route, and every call to it is
  # made from this server so the access token never reaches client JavaScript.
  web:
    image: ${OCI_REGISTRY}/${OCI_NAMESPACE}/${WEB_REPO:-youlearnweb}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production

      # Must match the redirect URI registered on the youlearn-web client in
      # Keycloak exactly, or every login ends in "Invalid parameter: redirect_uri".
      APP_URL: ${WEB_ORIGIN:?set WEB_ORIGIN}

      # Container-network address. The API publishes no port and is not
      # routable from outside this host.
      API_URL: http://api

      # Public issuer goes in tokens and is where the browser is sent to sign
      # in; internal issuer is how this container reaches Keycloak directly,
      # skipping the proxy and the public DNS round trip.
      KEYCLOAK_ISSUER: ${KEYCLOAK_PUBLIC_URL}/realms/youlearn
      KEYCLOAK_ISSUER_INTERNAL: http://keycloak:8080/realms/youlearn
      KEYCLOAK_CLIENT_ID: youlearn-web
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?set KEYCLOAK_CLIENT_SECRET}

      # Encrypts the session cookie. Rotating it signs everybody out, which is
      # the point: it is all that stands between a stolen cookie and a usable
      # refresh token.
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
    depends_on:
      api:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    logging: *logging
    networks: [youlearn]

  # ---------------------------------------------------------------- logging --
  #
  # Every service above writes to stdout, docker keeps three 10 MB files per
  # container, and `docker compose up` discards those the moment it recreates
  # one — which the update timer does on every release. That is enough to read
  # a crash that just happened and useless for "show me every upload the
  # scanner refused in July".
  #
  # VictoriaLogs is the durable copy: one Go binary, one volume, and a query
  # language whose first-class filter is a time range.
  logs:
    image: ${VICTORIALOGS_IMAGE:-victoriametrics/victoria-logs:v1.52.0}
    restart: unless-stopped
    command:
      - -storageDataPath=/victoria-logs-data
      # Old logs are deleted on this schedule. Raise it and the boot volume
      # pays for it; this is a 50 GB disk that also holds every uploaded video.
      - -retentionPeriod=${LOGS_RETENTION:-90d}
      - -loggerFormat=json
    ports:
      # Loopback only, deliberately. vmui has no authentication of its own, so
      # the way in is an SSH tunnel — port 22 already admits only the
      # operator's address:
      #
      #   ssh -L 9428:127.0.0.1:9428 <instance>
      #   open http://127.0.0.1:9428/select/vmui
      #
      # Setting LOGS_BIND=0.0.0.0 publishes an unauthenticated reader of every
      # log this platform produces. If you want it in a browser without a
      # tunnel, give it a hostname in deploy/Caddyfile behind basic_auth
      # instead of changing this.
      - "${LOGS_BIND:-127.0.0.1}:9428:9428"
    volumes:
      - logs-data:/victoria-logs-data
    logging: *logging
    networks: [youlearn]

  # Reads what docker already collected and forwards it to `logs`.
  #
  # It needs the docker socket, which is root on this host — that is the price
  # of the docker_logs source, and it is the same price Promtail, Alloy and
  # Dozzle charge. Nothing else in this stack gets the socket, and this
  # container runs no code of ours. If that trade stops being acceptable, put
  # tecnativa/docker-socket-proxy in front of it and allow GET only.
  logs-collector:
    image: ${VECTOR_IMAGE:-timberio/vector:0.57.0-alpine}
    restart: unless-stopped
    command: ["--config", "/etc/vector/vector.yaml"]
    volumes:
      - ./deploy/vector.yaml:/etc/vector/vector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      # Checkpoints: where each container's log was last read from. Without a
      # volume, a restart re-ships everything docker still has on disk.
      - logs-collector-state:/var/lib/vector
    depends_on:
      - logs
    logging: *logging
    networks: [youlearn]

  # A web interface for the stack itself: what is running, what it is logging,
  # restart it, open a shell in it, see what a volume holds.
  #
  # Worth saying plainly, because it is the reason this exists: Caddy has no
  # UI. Its admin API is JSON over :2019 and there is no page to look at.
  # Routing belongs in deploy/Caddyfile and in git, where it survives the next
  # deploy. What a browser is genuinely better at is "which container is
  # unhealthy, and what did it say before it died" — and that is this.
  portainer:
    image: ${PORTAINER_IMAGE:-portainer/portainer-ce:2.39.6}
    restart: unless-stopped
    ports:
      # Loopback, like vmui and the admin API — reached with
      #
      #   ssh -L 9000:127.0.0.1:9000 ubuntu@<instance>
      #
      # rather than a hostname with an address allow-list. That is a deliberate
      # choice: this operator's home address changes every few days, and an
      # allow-list that has to be updated when the ISP renews a lease is
      # exactly what locked SSH out for an evening. A tunnel follows you to
      # whatever network you are on and opens nothing to anybody else.
      - "127.0.0.1:9000:9000"
    volumes:
      # The docker socket is root on this host, and handing it over is the
      # entire point of Portainer: it can start, stop and shell into every
      # container here. Behind the tunnel it is also behind Portainer's own
      # login, which vmui and the admin API do not have.
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    logging: *logging
    networks: [youlearn]

volumes:
  clamav-db:
  keycloak-db-data:
  mysql-data:
  storage-data:
  caddy-data:
  caddy-config:
  logs-data:
  logs-collector-state:
  portainer-data:

networks:
  youlearn:
    driver: bridge
